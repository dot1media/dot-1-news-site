<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Dot 1 News">
  <rect width="64" height="64" rx="13" fill="#B81616"/>
  <!-- The stylized "1 with globe": a flag-topped numeral one whose stem flows
       into a framed globe, echoing the Dot 1 News mark. -->
  <g>
    <!-- Globe body, framed by a gold ring like the full mark -->
    <circle cx="32" cy="44.5" r="13" fill="#F4F0E7"/>
    <circle cx="32" cy="44.5" r="13" fill="none" stroke="#C8A24A" stroke-width="1.6"/>
    <!-- Landmasses (the Americas, suggested) -->
    <path d="M30.5 36.5c-2 .4-3.2 2.2-2.9 3.9.2 1.1 1.3 1.6 2.3 1.1 1.3-.7 2-2.3 1.7-3.8-.1-.8-.5-1.3-1.1-1.2z" fill="#B81616"/>
    <path d="M33 45c-1 1.3-1.3 3.4-.5 5.2.5 1.1 1.6 1 2.1-.2.6-1.5.4-3.4-.6-4.6-.3-.4-.7-.6-1-.4z" fill="#B81616"/>
    <!-- The numeral "1": flag + stem, flowing into the globe top -->
    <path d="M33 11.5h3.6V34h-7V22.8l-4.7 4.3-2.3-2.7z" fill="#F4F0E7"/>
  </g>
</svg>
